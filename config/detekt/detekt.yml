# Builds on Detekt's default config (buildUponDefaultConfig = true); only deviations live here.
# Detekt 2 semantics: `allowed*` = largest value that still passes (1.x thresholds failed at >=).
config:
  validation: true

complexity:
  ComplexCondition:
    allowedConditions: 4
  LongParameterList:
    allowedFunctionParameters: 7
    allowedConstructorParameters: 9
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  LongMethod:
    allowedLines: 80
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    allowedFunctionsPerFile: 25
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 20
    ignorePrivate: true
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreEnums: true
    ignoreNamedArgument: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/androidTest/**', '**/designsystem/**', '**/*Demo*']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false
  MaxLineLength:
    maxLineLength: 140
    excludes: ['**/test/**', '**/androidTest/**']
  WildcardImport:
    active: true

exceptions:
  TooGenericExceptionCaught:
    excludes: ['**/test/**']
  SwallowedException:
    allowedExceptionNameRegex: '_|(ignore|expected).*'
