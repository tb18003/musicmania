# Gradle settings for GitHub Actions, copied to ~/.gradle/gradle.properties (overrides the project file).
# Private-repo runners have 2 cores and ~7 GB of RAM: a 4 GB daemon plus a separate Kotlin daemon
# and Robolectric test JVMs pushed them into swap, and the job timed out.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
# Compile Kotlin inside the Gradle daemon instead of a second JVM.
kotlin.compiler.execution.strategy=in-process
