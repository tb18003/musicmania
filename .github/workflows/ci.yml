name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Static analysis, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Placeholder credentials: CI builds never need real Spotify secrets.
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_REDIRECT_URI: "https://example.invalid/musicmania/callback"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless & Detekt
        run: ./gradlew spotlessCheck detekt -PwarningsAsErrors=false

      - name: Unit, integration and architecture tests
        run: ./gradlew testDebugUnitTest test

      - name: Screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease

      - name: Coverage report
        run: ./gradlew koverXmlReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7
