name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Static analysis, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Placeholder credentials: CI builds never need real Spotify secrets.
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_REDIRECT_URI: "https://example.invalid/musicmania/callback"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless & Detekt
        run: ./gradlew spotlessCheck detekt -PwarningsAsErrors=false

      - name: Unit, integration and architecture tests
        run: ./gradlew testDebugUnitTest test

      - name: Screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease :baselineprofile:assemble

      - name: Coverage report
        run: ./gradlew koverXmlReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7

  instrumented:
    name: Instrumented tests (Gradle Managed Device)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_REDIRECT_URI: "https://example.invalid/musicmania/callback"
    steps:
      - uses: actions/checkout@v4

      # Hardware acceleration for the emulator on GitHub-hosted Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on pixel6Api34 (ATD image)
        run: >
          ./gradlew pixel6Api34DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
