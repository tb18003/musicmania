name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  # Manual run (Actions > CI > Run workflow): checks every part of the repository.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Placeholder credentials: CI builds never need real Spotify secrets.
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_REDIRECT_URI: "https://example.invalid/musicmania/callback"

jobs:
  # Pull requests only run the jobs of the parts they touch; pushes and manual runs check everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Which parts changed?
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          printf 'Changed files:\n%s\n' "$changed"
          # Shared config and CI changes affect the mobile build too.
          if printf '%s\n' "$changed" | grep -qE '^(mobile/|config/|\.github/|\.editorconfig$)'; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- mobile (parallel jobs)

  mobile-static:
    name: Mobile · Static analysis
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: ./.github/actions/setup-mobile
      - name: Spotless, Detekt and Android Lint
        run: ./gradlew spotlessCheck detekt lintDebug
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-static-reports
          path: |
            mobile/**/build/reports/lint-results-*
            mobile/**/build/reports/detekt/
          retention-days: 7

  mobile-unit-tests:
    name: Mobile · Unit tests and coverage
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
      - name: Unit, integration and architecture tests
        run: ./gradlew testDebugUnitTest test koverXmlReport
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-test-reports
          path: |
            mobile/**/build/reports/tests/
            mobile/build/reports/kover/
          retention-days: 7

  mobile-screenshots:
    name: Mobile · Screenshot tests
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
      - name: Compare screenshots with the committed baselines
        run: ./gradlew verifyRoborazziDebug
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-screenshot-diffs
          path: mobile/**/build/outputs/roborazzi/
          retention-days: 7

  mobile-build:
    name: Mobile · Build
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mobile
      - name: Debug, release (R8) and baseline profile module
        run: ./gradlew assembleDebug assembleRelease :baselineprofile:assemble

  mobile-instrumented:
    name: Mobile · Instrumented tests (emulator)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      # The runner's disk is mostly preinstalled toolchains; the emulator needs room.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk
          df -h /

      # Hardware acceleration for the emulator on GitHub-hosted Linux runners.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/setup-mobile

      # Build everything first, then stop Gradle, so it never competes with the emulator for memory.
      - name: Build app and test APKs
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest
          ./gradlew --stop

      # A single emulator for all modules (Gradle Managed Devices started one per module in parallel).
      - name: Run instrumented tests on an API 34 emulator (ATD image)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          working-directory: mobile
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 2048M
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # APKs are already built: a small Gradle heap is enough to install and run them.
          script: ./gradlew connectedDebugAndroidTest -Dorg.gradle.jvmargs=-Xmx1536m

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-instrumented-reports
          path: |
            mobile/**/build/reports/androidTests/
            mobile/**/build/outputs/androidTest-results/
          retention-days: 7

  # ---------------------------------------------------------------- gate

  # The only check the branch rules need to require: it fails if any job failed or was
  # cancelled, and passes when jobs were skipped because their part did not change.
  ci-success:
    name: CI success
    if: always()
    needs: [changes, secrets-scan, mobile-static, mobile-unit-tests, mobile-screenshots, mobile-build, mobile-instrumented]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::A required job ended as '$result'"; exit 1 ;;
            esac
          done
