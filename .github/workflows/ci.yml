name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  # Manual run (Actions > CI > Run workflow), e.g. to execute the instrumented tests on demand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the pull request's commits through the API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Static analysis, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Placeholder credentials: CI builds never need real Spotify secrets.
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_REDIRECT_URI: "https://example.invalid/musicmania/callback"
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Spotless & Detekt
        run: ./gradlew spotlessCheck detekt -PwarningsAsErrors=false

      - name: Unit, integration and architecture tests
        run: ./gradlew testDebugUnitTest test

      - name: Screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Assemble
        run: ./gradlew assembleDebug assembleRelease :baselineprofile:assemble

      - name: Coverage report
        run: ./gradlew koverXmlReport

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
          retention-days: 7

  instrumented:
    name: Instrumented tests (emulator)
    # An emulator run costs ~10 runner minutes: only on demand and for release PRs to master.
    # Run locally with ./gradlew connectedDebugAndroidTest before opening a PR.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPOTIFY_CLIENT_ID: ""
      SPOTIFY_REDIRECT_URI: "https://example.invalid/musicmania/callback"
    steps:
      - uses: actions/checkout@v4

      # Hardware acceleration for the emulator on GitHub-hosted Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # Build everything first so Gradle and the emulator never compete for the runner's memory.
      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      # A single emulator for all modules. Gradle Managed Devices created one snapshot per module
      # in parallel, and the emulator died silently on the 2-core / 7 GB runner.
      - name: Run instrumented tests on an API 34 emulator (ATD image)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
