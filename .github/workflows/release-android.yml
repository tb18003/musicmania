name: Release Android

# Every release tag (web-vX.Y.Z: the web and the app share one version, ADR 0013) builds the signed
# APK and attaches it to that tag's GitHub release, creating the release if needed. Setup (once):
# docs/setup/android-release.md.
on:
  push:
    tags: ["web-v*"]
  # To rebuild a release by hand: Run workflow, and pick the tag (not a branch) in "Use workflow from".
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    name: Build, sign and attach the APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Protected environment: the keystore secrets only exist here, and only release tags may use it.
    environment: android-release
    permissions:
      contents: write # create the release and upload the APK
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag must match the release version
        run: |
          version="$(jq -r .version web/package.json)"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$TAG" != "web-v$version" ]; then
            echo "::error::Tag $TAG does not match web/package.json ($version). Bump the version, then tag web-v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-mobile

      # The keystore exists only on the runner's temporary disk for the length of the job.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The android-release environment has no ANDROID_KEYSTORE_BASE64 secret (docs/setup/android-release.md)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MUSICMANIA_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: mobile
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI_ANDROID }}
          MUSICMANIA_API_URL: ${{ vars.MUSICMANIA_API_URL }}
          MUSICMANIA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MUSICMANIA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MUSICMANIA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$SPOTIFY_CLIENT_ID" ] || [ -z "$SPOTIFY_REDIRECT_URI" ]; then
            echo "::error::Set the SPOTIFY_CLIENT_ID and SPOTIFY_REDIRECT_URI_ANDROID variables (docs/setup/android-release.md)."
            exit 1
          fi
          ./gradlew :app:assembleRelease

      # Without a keystore the build would produce app-release-unsigned.apk: never publish that.
      - name: Check the signature and name the APK
        run: |
          apk=mobile/app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::No signed APK was produced."; exit 1; }
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # The certificate fingerprint is public; it must be listed in assetlinks.json for sign-in to work.
          grep -m1 'SHA-256' "$RUNNER_TEMP/certs.txt" | sed 's/^/::notice title=Signing certificate::/'
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$apk" "$RUNNER_TEMP/dist/musicmania-$VERSION.apk"
          (cd "$RUNNER_TEMP/dist" && sha256sum "musicmania-$VERSION.apk" > "musicmania-$VERSION.apk.sha256")

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP/dist/musicmania-$VERSION.apk" "$RUNNER_TEMP/dist/musicmania-$VERSION.apk.sha256")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --title "MusicMania v$VERSION" --generate-notes
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
