# Publishes the web client (web/) to GitHub Pages: https://<owner>.github.io/musicmania/
# Setup and the values it needs: docs/setup/web-deploy.md
name: Deploy web

on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer one waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    # Public values, stored as repository variables (not secrets): the web client is a PKCE
    # public client exactly like the Android app, and these values end up in the page anyway.
    env:
      VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      VITE_SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI_WEB }}
      VITE_MUSICMANIA_API_URL: ${{ vars.MUSICMANIA_API_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # The Android app's App Link fallback page must survive every web deployment.
      - name: Smoke test
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl -fsS "${PAGE_URL}" | grep -q '<title>MusicMania</title>'
          curl -fsS "${PAGE_URL}callback.html" | grep -q 'MusicMania sign-in'
