name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must not be reported here** — see SECURITY.md.
        Never paste tokens, authorization codes or your data export.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected vs. actual behaviour.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
  - type: input
    id: device
    attributes:
      label: Device and Android version
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Signed in with Spotify, Demo mode]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact any personal data.
