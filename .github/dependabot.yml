version: 2
updates:
  - package-ecosystem: gradle
    directory: /mobile
    target-branch: develop
    # Every update PR runs the full CI: batch them monthly to save runner minutes.
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
      testing:
        patterns: ["junit*", "app.cash.turbine*", "io.mockk*", "org.robolectric*", "io.github.takahirom.roborazzi*", "com.lemonappdev*"]

  - package-ecosystem: gradle
    directory: /api
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Integration tests must run the same Postgres major as production (Supabase: 17).
      - dependency-name: "io.zonky.test.postgres:embedded-postgres-binaries-bom"
        update-types: ["version-update:semver-major"]
    groups:
      api-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Node types follow the Node version in use (web/.nvmrc), not the newest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      web-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    target-branch: develop
    schedule:
      interval: monthly
    ignore:
      # The build JDK matches the runtime image (distroless java21) and CLAUDE.md (JDK 21).
      # Moving to Java 25 is a deliberate change of both, not a version bump.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    # Workflows plus the local composite actions they use.
    directories: ["/", "/.github/actions/*"]
    target-branch: develop
    schedule:
      interval: monthly
    # One PR for all workflow actions: they all edit ci.yml and would conflict with each other.
    groups:
      github-actions:
        patterns: ["*"]
